[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    { id = "RUSTSEC-2024-0436", reason = "paste is a proc-macro used at build time only (via vortex-fastlanes); no runtime exposure" },
    { id = "RUSTSEC-2025-0134", reason = "rustls-pemfile is pulled by datafusion-postgres for PEM parsing of operator-supplied files; upstream replacement tracked" },
    # rumqttc 0.25.1 links rustls-webpki 0.102.8 only for its error type (src/tls.rs:
    # `WebPki(#[from] webpki::Error)`). ANKAA passes rumqttc a rustls 0.23 ClientConfig, so every
    # certificate check runs in rustls-webpki 0.103.16 (patched); no 0.102 validation code runs.
    # Remove when rumqttc moves to webpki 0.103.
    { id = "RUSTSEC-2026-0049", reason = "rustls-webpki 0.102 via rumqttc: error type only, validation runs in 0.103.16" },
    { id = "RUSTSEC-2026-0098", reason = "rustls-webpki 0.102 via rumqttc: error type only, validation runs in 0.103.16" },
    { id = "RUSTSEC-2026-0099", reason = "rustls-webpki 0.102 via rumqttc: error type only, validation runs in 0.103.16" },
    { id = "RUSTSEC-2026-0104", reason = "rustls-webpki 0.102 via rumqttc: error type only, validation runs in 0.103.16" },
    { id = "RUSTSEC-2026-0382", reason = "rustls-webpki 0.102 via rumqttc: error type only, validation runs in 0.103.16" },
]

[licenses]
version = 2
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
    "CDLA-Permissive-2.0", # webpki-roots (Mozilla CA bundle)
    "0BSD",                # enum-iterator (via vortex)
    "Unlicense",           # json-writer (via dbn)
    "bzip2-1.0.6",         # libbz2-rs-sys (via datafusion compression)
    "NCSA",                # libfuzzer-sys (LLVM libFuzzer; fuzz targets only)
]
confidence-threshold = 0.9


[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
deny = [
    { crate = "openssl-sys", reason = "rustls only" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
