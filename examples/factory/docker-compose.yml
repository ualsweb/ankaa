# ANKAA factory demo: a simulated plant publishing to an MQTT Unified Namespace, ANKAA storing and
# aggregating it live, Grafana reading it over the Postgres protocol.
#
#   docker compose up -d        then open http://localhost:3000 (Grafana, no login)
#   docker compose down -v      stop and delete the data
#
# Ports are bound to localhost only. The token below is for this demo; never reuse it.
name: ankaa-factory

services:
  mqtt:
    image: eclipse-mosquitto:2
    command: mosquitto -c /mosquitto-no-auth.conf
    ports: ["127.0.0.1:1883:1883"]
    restart: unless-stopped

  ankaa:
    image: ghcr.io/ualsweb/ankaa:latest
    build: ../..                       # used when the image cannot be pulled (or: docker compose build)
    environment:
      ANKAA_TOKEN: demo-token-not-secret
      RUST_LOG: info
    volumes:
      - ./ankaad.toml:/etc/ankaa/ankaad.toml:ro
      - ankaa-data:/var/lib/ankaa
    ports:
      - "127.0.0.1:50051:50051"        # Arrow Flight (Python, ankaad query)
      - "127.0.0.1:55432:5432"         # Postgres wire (psql, Grafana, BI tools)
      - "127.0.0.1:9100:9100"          # Prometheus metrics
    depends_on: [mqtt]
    restart: unless-stopped

  plant:
    image: python:3.12-slim
    command: sh -c "pip install --quiet --disable-pip-version-check --root-user-action=ignore paho-mqtt==2.1.0 && python -u /sim/simulate.py"
    environment:
      MQTT_HOST: mqtt
      PREFIX: acme/plant1
    volumes: ["./simulator:/sim:ro"]
    depends_on: [mqtt]
    restart: unless-stopped

  grafana:
    image: grafana/grafana-oss:11.5.2
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/plant.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [ankaa]
    restart: unless-stopped

volumes:
  ankaa-data:
