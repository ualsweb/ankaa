name: sve-qemu
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "crates/ankaa-simd/**"
      - "crates/ankaa-store/**"
      - "crates/ankaa-ts/**"
      - ".github/workflows/sve-qemu.yml"
      - "Cargo.*"
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
permissions:
  contents: read
jobs:
  sve2-differential:
    name: SVE2 differential under QEMU (VL=${{ matrix.vl_bits }})
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        include:
          - { vl_bytes: 16, vl_bits: 128 }
          - { vl_bytes: 32, vl_bits: 256 }
          - { vl_bytes: 64, vl_bits: 512 }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq qemu-user
      - run: qemu-aarch64 --version | head -1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Run SVE2 tests under qemu-aarch64 -cpu max
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_RUNNER: qemu-aarch64 -cpu max,sve-default-vector-length=${{ matrix.vl_bytes }}
          ANKAA_EXPECT_SVE2: ${{ matrix.vl_bytes }}
        run: cargo test -p ankaa-simd --features sve2 -- --test-threads=1
      - name: Branchless-v2 gate on the SVE2 kernels
        run: |
          rlib=$(cargo build -p ankaa-simd --features sve2 --message-format=json 2>/dev/null \
                 | jq -r 'select(.reason=="compiler-artifact" and .target.name=="ankaa-simd") | .filenames[] | select(endswith(".rlib"))' | tail -1)
          echo "rlib: $rlib"
          mkdir -p /tmp/rlib && (cd /tmp/rlib && ar x "$rlib") && scripts/branchless-gate.sh /tmp/rlib/*.o
