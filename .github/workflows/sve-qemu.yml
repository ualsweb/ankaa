name: sve-qemu
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "crates/ankaa-simd/**"
      - "crates/ankaa-store/**"
      - "crates/ankaa-ts/**"
      - ".github/workflows/sve-qemu.yml"
      - "Cargo.*"
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
permissions:
  contents: read
jobs:
  sve2-differential:
    name: SVE2 differential under QEMU (VL=${{ matrix.vl_bits }})
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        include:
          - { vl_bytes: 16, vl_bits: 128 }
          - { vl_bytes: 32, vl_bits: 256 }
          - { vl_bytes: 64, vl_bits: 512 }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # one static qemu-aarch64 binary, cached: after the first install no run depends on the
      # Ubuntu mirror (its DNS has failed on the runners for whole afternoons)
      - id: qemu-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/qemu
          key: qemu-user-static-noble-arm64-v1
      - name: Install QEMU (only when not cached)
        if: steps.qemu-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/qemu
          # the Ubuntu ports mirror first; if the runner cannot reach it, Debian's package of the
          # same static binary through a container (Docker Hub and deb.debian.org, other hosts)
          if timeout 120 sh -c 'sudo apt-get update -qq && sudo apt-get install -y -qq qemu-user-static' \
             && [ -x /usr/bin/qemu-aarch64-static ]; then
            cp /usr/bin/qemu-aarch64-static ~/qemu/qemu-aarch64
          else
            echo "Ubuntu mirror unreachable: taking qemu-user-static from Debian"
            docker run --rm -v "$HOME/qemu:/out" debian:bookworm-slim sh -c \
              'apt-get update -qq && apt-get install -y -qq qemu-user-static >/dev/null && cp /usr/bin/qemu-aarch64-static /out/qemu-aarch64'
          fi
          sudo chown "$(id -u)" ~/qemu/qemu-aarch64
      - run: echo "$HOME/qemu" >> "$GITHUB_PATH"
      - run: qemu-aarch64 --version | head -1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Run SVE2 tests under qemu-aarch64 -cpu max
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_RUNNER: qemu-aarch64 -cpu max,sve-default-vector-length=${{ matrix.vl_bytes }}
          ANKAA_EXPECT_SVE2: ${{ matrix.vl_bytes }}
        run: cargo test -p ankaa-simd --features sve2 -- --test-threads=1
      - name: Branchless-v2 gate on the SVE2 kernels
        run: |
          rlib=$(cargo build -p ankaa-simd --features sve2 --message-format=json 2>/dev/null \
                 | jq -r 'select(.reason=="compiler-artifact" and (.target.name=="ankaa_simd" or .target.name=="ankaa-simd")) | .filenames[] | select(endswith(".rlib"))' | tail -1)
          echo "rlib: $rlib"
          mkdir -p /tmp/rlib && (cd /tmp/rlib && ar x "$rlib") && scripts/branchless-gate.sh /tmp/rlib/*.o
