name: miri
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "crates/ankaa-ring/**"
      - "crates/ankaa-store/**"
      - "crates/ankaa-wal/**"
      - ".github/workflows/miri.yml"
permissions:
  contents: read
jobs:
  miri:
    name: miri (non-asm unsafe)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: nightly-2026-10-15
          components: miri, rust-src
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo +nightly-2026-10-15 miri setup
      - run: cargo +nightly-2026-10-15 miri test -p ankaa-ring -p ankaa-store -p ankaa-wal --no-default-features
        env:
          # tempfile/fs in WAL tests need isolation disabled; heavy tests are #[cfg_attr(miri, ignore)]
          MIRIFLAGS: -Zmiri-strict-provenance -Zmiri-symbolic-alignment-check -Zmiri-disable-isolation
  loom:
    name: loom (SPSC ring models)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo loom
