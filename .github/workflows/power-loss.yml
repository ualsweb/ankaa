name: power-loss
on:
  pull_request:
    paths: ["crates/ankaa-wal/**", "scripts/power-loss-rig.sh", ".github/workflows/power-loss.yml"]
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dm-flakey:
    name: WAL power-loss rig (dm-flakey)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo build --release -p ankaa-wal --bin wal-torture
      - run: sudo apt-get install -y -qq dmsetup e2fsprogs
      - name: Run 200 power-loss iterations (nightly runs 1000)
        run: |
          n=200; [[ "${{ github.event_name }}" == "schedule" ]] && n=1000
          sudo scripts/power-loss-rig.sh "$n" target/release/wal-torture
