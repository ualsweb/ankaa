name: python
on:
  pull_request:
    paths:
      - "crates/ankaa-py/**"
      - "crates/ankaa-flight/**"
      - "crates/ankaa-sql/**"
      - "crates/ankaa-feeds/**"
      - "crates/ankaa-ingest/**"
      - "crates/ankaa-store/**"
      - "crates/ankaa-ts/**"
      - "crates/ankaa-core/**"
      - ".github/workflows/python.yml"
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  wheel:
    name: maturin build + pytest (aarch64)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: crates/ankaa-py
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Build and test
        working-directory: crates/ankaa-py
        run: |
          python -m venv .venv && . .venv/bin/activate
          pip install -q maturin pytest pyarrow polars pandas
          maturin develop --release --features test-server
          pytest -q
      - name: Build wheel artifact
        working-directory: crates/ankaa-py
        run: |
          . .venv/bin/activate
          maturin build --release -o dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ankaa-wheel-aarch64
          path: crates/ankaa-py/dist/*.whl
